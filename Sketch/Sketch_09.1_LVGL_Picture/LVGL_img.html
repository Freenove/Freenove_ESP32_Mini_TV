<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Freenove ESP32 LVGL v9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .code-area { font-family: 'Fira Code', 'Consolas', monospace; font-size: 12px; line-height: 1.5; }
        input[type="number"] { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; width: 85px; }
        .drag-active { border-color: #4f46e5 !important; background-color: #f5f3ff !important; }
        #loading { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen" id="dropZone">
    <div class="container mx-auto py-10 px-4">
        <!-- Header -->
        <div class="gradient-bg p-8 rounded-t-3xl shadow-lg text-white">
            <h1 class="text-3xl font-bold">Freenove ESP32 LVGL v9 <span class="text-sm font-normal opacity-75">v1.0</span></h1>
            <p class="mt-2 opacity-90 text-sm">Drag & Drop Support | Auto-Scaling | Compatible with ESP32 & Arduino</p>
        </div>

        <div class="bg-white p-8 rounded-b-3xl shadow-xl flex flex-col lg:flex-row gap-8">

            <div class="lg:w-1/3 space-y-6">

                <div id="fileBox" class="p-8 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200 text-center transition-all">
                    <label class="block text-sm font-bold text-gray-700 mb-2">1. Drag & Drop or Select Image</label>
                    <input type="file" id="fileInput" accept="image/*" class="hidden"/>
                    <button onclick="document.getElementById('fileInput').click()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700 shadow-md">Choose File</button>
                    <p class="text-gray-400 text-xs mt-3">Suggested: 240x240 or adjust based on screen</p>
                </div>

                <div class="p-4 bg-indigo-50 rounded-xl border border-indigo-100">
                    <label class="block text-sm font-bold text-indigo-900 mb-3">2. Target Dimensions (Resizing)</label>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">Width</span><br>
                            <input type="number" id="targetW" value="240" class="w-full mt-1 outline-none focus:ring-2 focus:ring-indigo-400">
                        </div>
                        <div>
                            <span class="text-[10px] text-indigo-400 font-bold uppercase">Height</span><br>
                            <input type="number" id="targetH" value="240" class="w-full mt-1 outline-none focus:ring-2 focus:ring-indigo-400">
                        </div>
                    </div>
                    <label class="flex items-center mt-3 cursor-pointer">
                        <input type="checkbox" id="keepRatio" checked class="form-checkbox h-4 w-4 text-indigo-600">
                        <span class="ml-2 text-xs text-indigo-800">Keep Aspect Ratio</span>
                    </label>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <label class="block text-sm font-bold text-gray-700 mb-2">3. Color Format</label>
                    <select id="cfSelect" class="block w-full py-2 px-3 text-sm border-gray-300 rounded-md bg-white border">
                        <option value="RGB565" selected>RGB565</option>
                        <option value="RGB565_SWAPPED">RGB565_SWAPPED</option>
                    </select>
                </div>

                <div class="p-4 bg-white rounded-xl border border-gray-100 shadow-inner">
                    <canvas id="previewCanvas" class="max-w-full h-auto border rounded bg-gray-200 mx-auto mb-3 shadow-md"></canvas>
                    <div class="text-[11px] text-gray-500 space-y-1 text-center font-mono">
                        <p>Source: <span id="origSize">-</span></p>
                        <p>Output: <span id="finalSize" class="text-indigo-600 font-bold">-</span></p>
                        <p>Data: <span id="dataSize" class="text-indigo-600 font-bold">-</span> Bytes</p>
                    </div>
                </div>

                <button id="convertBtn" class="w-full gradient-bg text-white font-bold py-4 px-6 rounded-xl hover:shadow-2xl transition-all flex items-center justify-center space-x-2">
                    <span id="btnText">Convert & Generate Code</span>
                    <span id="loading" class="animate-spin h-5 w-5 border-2 border-white border-t-transparent rounded-full"></span>
                </button>
            </div>

            <div class="lg:w-2/3 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-bold text-gray-700">C Array Output</label>
                    <button id="copyBtn" class="text-xs bg-indigo-600 text-white hover:bg-indigo-700 py-2 px-5 rounded-full shadow-md transition">Copy Code</button>
                </div>
                <textarea id="outputArea" readonly class="code-area w-full flex-grow h-[600px] p-5 bg-gray-900 text-indigo-300 rounded-2xl border-4 border-gray-800 outline-none resize-none shadow-2xl" placeholder="Waiting for image import..."></textarea>
            </div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileBox = document.getElementById('fileBox');
        const fileInput = document.getElementById('fileInput');
        const targetW = document.getElementById('targetW');
        const targetH = document.getElementById('targetH');
        const keepRatio = document.getElementById('keepRatio');
        const cfSelect = document.getElementById('cfSelect');
        const convertBtn = document.getElementById('convertBtn');
        const btnText = document.getElementById('btnText');
        const loading = document.getElementById('loading');
        const outputArea = document.getElementById('outputArea');
        const previewCanvas = document.getElementById('previewCanvas');
        const origSizeDisp = document.getElementById('origSize');
        const finalSizeDisp = document.getElementById('finalSize');
        const dataSizeDisp = document.getElementById('dataSize');
        const copyBtn = document.getElementById('copyBtn');

        let sourceImg = new Image();
        let originalRatio = 1;
        let currentFileName = "lvgl_img";

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => {
            document.body.addEventListener(n, e => { e.preventDefault(); e.stopPropagation(); });
        });

        ['dragenter', 'dragover'].forEach(n => {
            dropZone.addEventListener(n, () => fileBox.classList.add('drag-active'));
        });
        ['dragleave', 'drop'].forEach(n => {
            dropZone.addEventListener(n, () => fileBox.classList.remove('drag-active'));
        });

        dropZone.addEventListener('drop', e => {
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.onchange = e => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            currentFileName = file.name.split('.')[0].replace(/[^a-zA-Z0-9]/g, '_');
            const reader = new FileReader();
            reader.onload = e => {
                sourceImg.onload = () => {
                    originalRatio = sourceImg.width / sourceImg.height;
                    origSizeDisp.innerText = `${sourceImg.width}x${sourceImg.height}`;
                    
                    let w = sourceImg.width, h = sourceImg.height;
                    if (w > 240 || h > 240) {
                        w = originalRatio > 1 ? 240 : Math.round(240 * originalRatio);
                        h = originalRatio > 1 ? Math.round(240 / originalRatio) : 240;
                    }
                    targetW.value = w;
                    targetH.value = h;
                    updatePreview();
                };
                sourceImg.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        targetW.oninput = () => {
            if (keepRatio.checked && originalRatio) targetH.value = Math.round(targetW.value / originalRatio);
            updatePreview();
        };
        targetH.oninput = () => {
            if (keepRatio.checked && originalRatio) targetW.value = Math.round(targetH.value * originalRatio);
            updatePreview();
        };

        function updatePreview() {
            if (!sourceImg.src) return;
            const w = parseInt(targetW.value) || 1, h = parseInt(targetH.value) || 1;
            finalSizeDisp.innerText = `${w}x${h}`;
            dataSizeDisp.innerText = (w * h * 2).toLocaleString();
            previewCanvas.width = w;
            previewCanvas.height = h;
            const ctx = previewCanvas.getContext('2d');
            ctx.drawImage(sourceImg, 0, 0, w, h);
        }

        convertBtn.onclick = () => {
            if (!sourceImg.src) { alert("Please import an image first!"); return; }
            
            convertBtn.disabled = true;
            btnText.innerText = "Processing Pixels...";
            loading.style.display = "block";

            setTimeout(() => {
                const w = parseInt(targetW.value), h = parseInt(targetH.value);
                const cf = cfSelect.value;
                const ctx = previewCanvas.getContext('2d');
                const imgData = ctx.getImageData(0, 0, w, h).data;
                
                const pixels = [];
                for (let i = 0; i < imgData.length; i += 4) {
                    const r = imgData[i], g = imgData[i+1], b = imgData[i+2];
                    const rgb565 = ((r & 0xF8) << 8) | ((g & 0xFC) << 3) | (b >> 3);
                    
                    if (cf === 'RGB565_SWAPPED') {
                        pixels.push((rgb565 >> 8) & 0xFF);
                        pixels.push(rgb565 & 0xFF);
                    } else {
                        pixels.push(rgb565 & 0xFF);
                        pixels.push((rgb565 >> 8) & 0xFF);
                    }
                }

                const hexParts = [];
                for (let i = 0; i < pixels.length; i++) {
                    hexParts.push("0x" + pixels[i].toString(16).padStart(2, '0'));
                }

                let formattedHex = "";
                for (let i = 0; i < hexParts.length; i++) {
                    formattedHex += hexParts[i] + ", ";
					if (i == hexParts.length - 1) break;
                    if ((i + 1) % 12 === 0) formattedHex += "\n    ";
                }

                outputArea.value = `
/*
 * @ File:   [image.h]
 * @ Type:   [${cf}]
 * @ Author: [Vegetable-SYC]
 */			

const unsigned char img_asset[] PROGMEM = {
    ${formattedHex}
};`;

                convertBtn.disabled = false;
                btnText.innerText = "Success! Convert Again";
                loading.style.display = "none";
            }, 50);
        };

        copyBtn.onclick = () => {
            outputArea.select();
            document.execCommand('copy');
            const oldText = copyBtn.innerText;
            copyBtn.innerText = "✔ Copied to Clipboard";
            setTimeout(() => copyBtn.innerText = oldText, 2000);
        };
    </script>
</body>
</html>
